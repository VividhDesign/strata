[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "strata-vdb"
version = "0.2.0"
description = "An HNSW vector database written from scratch in C++ with Python bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["faiss-cpu", "hnswlib", "h5py", "matplotlib", "requests"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/strata"]
build-dir = "build/py-{wheel_tag}"

[tool.scikit-build.cmake.define]
STRATA_BUILD_PYTHON = "ON"
STRATA_BUILD_TESTS = "OFF"
STRATA_BUILD_SERVER = "OFF"
STRATA_BUILD_BENCH = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
